<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Jenny & David · Christmas Songs</title><style>html{color-scheme:dark;scroll-behavior:smooth}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;color:#f5f5f5;background:#000}main{max-width:760px;margin:auto;padding:24px 20px 80px}h1{font-size:27px}h2{font-size:18px;margin-top:35px;color:#bcbcbc}.song{display:block;padding:17px 2px;border-bottom:1px solid #303030;color:#f5f5f5;text-decoration:none;font-size:20px}.song span{float:right;color:#aaa}.page{min-height:100vh;padding-top:30px;border-top:1px solid #303030;margin-top:70px}.back{position:sticky;top:0;display:block;background:#000;padding:12px 0;color:#a8caff;text-decoration:none;font-weight:650}.lyrics{font-size:clamp(18px,4.6vw,25px);line-height:1.55;white-space:normal}.lyrics p{margin:0 0 24px}.lyrics strong{font-weight:800}.empty{color:#b0b0b0;font-style:italic}.searchbox{width:100%;box-sizing:border-box;padding:14px 16px;border:1px solid #555;border-radius:12px;font-size:18px;margin:8px 0 12px;background:#111;color:#fff}.searchbox:focus{outline:2px solid #a8caff;outline-offset:1px}.searchstatus{font-size:14px;color:#b0b0b0;margin:0 0 10px}.song[hidden]{display:none}.artist{font-style:italic}.song .artist{float:none;color:inherit}html.light{color-scheme:light}html.light body{background:white;color:#161616}html.light h2{color:#555}html.light .song{color:#151515;border-bottom-color:#eee}html.light .song span{color:#999}html.light .page{border-top-color:#eee}html.light .back{background:white;color:#285ea7}html.light .empty,html.light .searchstatus{color:#666}html.light .searchbox{background:white;color:#161616;border-color:#bbb}html.light .searchbox:focus{outline-color:#285ea7}html.light #download-offline,html.light #theme-toggle{color:#667085}#theme-toggle{margin-left:16px;padding:5px 0;border:0;background:transparent;color:#b0b0b0;font-size:13px;text-decoration:underline;cursor:pointer}#memo-toggle{margin-left:16px;padding:5px 0;border:0;background:transparent;color:#c4a1ff;font-size:13px;text-decoration:underline;cursor:pointer}#song-controls{display:flex;align-items:center;flex-wrap:nowrap;gap:14px;margin-bottom:14px}#song-controls button{flex:0 0 auto;margin:0!important;white-space:nowrap}#song-controls #memo-toggle{margin-left:0}html.light #memo-toggle{color:#7134a6}.lyrics.memo p{display:none}.lyrics.memo p.memo-line{display:block;margin-bottom:20px}.lyrics.memo p.memo-line strong{font-weight:800}.lyrics.memo p.memo-line{color:#c4a1ff}html.light .lyrics.memo p.memo-line{color:#7134a6}.lyrics.memo p.memo-line strong{color:#f5f5f5}html.light .lyrics.memo p.memo-line strong{color:#161616}.memo .memo-hidden{display:none}.xmas-link{display:flex;align-items:center;gap:12px;margin:12px 0 18px;padding:14px 16px;border:1px solid #8f3443;border-radius:13px;background:linear-gradient(110deg,#173d32,#302326);color:#fff;text-decoration:none;font-weight:700;font-size:18px}.xmas-link .xmas-arrow{margin-left:auto;color:#f6d58d}.xmas-page{border-top:3px solid #b8454d;background:radial-gradient(ellipse at top,#1e3b30 0%,transparent 65%);padding:24px 14px 60px;border-radius:14px}.xmas-page h1{color:#ffe1a2;margin:12px 0}.xmas-ornament{text-align:center;letter-spacing:9px;font-size:25px}.xmas-note{color:#e1dfd5}.xmas-page .song{border-bottom-color:#496354}.xmas-page .back{background:#173329;color:#fff}html.light .xmas-page{background:radial-gradient(ellipse at top,#e5f2e9,transparent 70%)}html.light .xmas-page h1{color:#8b2634}html.light .xmas-note{color:#565656}html.light .xmas-page .back{background:#e5f2e9;color:#285ea7} .xmas-page{margin-top:0;min-height:75vh}.xmas-home{display:inline-block;margin-bottom:20px;color:#ffe1a2;text-decoration:none;font-weight:650}html.light .xmas-home{color:#8b2634}#christmas-controls{display:flex;justify-content:space-between;align-items:center;gap:10px}#christmas-label{color:#ffe1a2;font-size:clamp(14px,3.6vw,20px);font-weight:750;white-space:nowrap}html.light #christmas-label{color:#9a6926}#christmas-memo{border:1px solid #8fbb9a;border-radius:9px;background:#173d32;color:#fff;padding:9px 14px;font-size:14px;cursor:pointer}html.light #christmas-memo{background:#e5f2e9;color:#234a38}</style></head><body><main><div class="xmas-page"><a class="xmas-home" href="songbook.html">← Songbook principal</a><div class="xmas-ornament" aria-hidden="true">❄️ ✨ 🎄 ✨ ❄️</div><h1>Christmas Songs</h1><p class="xmas-note">Les chansons de Noël seront ajoutées ici.</p><div id="christmas-controls"><span id="christmas-label">Christmas songs</span><button type="button" id="christmas-memo" aria-pressed="false">☷ Pense-bête</button></div><label for="christmas-search" style="display:block;font-weight:600;margin-top:16px">Rechercher une chanson ou un artiste</label><input id="christmas-search" class="searchbox" type="search" placeholder="Titre ou artiste…" autocomplete="off" autocapitalize="none" spellcheck="false"/><p id="christmas-status" class="searchstatus" aria-live="polite">0 chanson</p><div id="christmas-song-list"></div><div class="xmas-ornament" aria-hidden="true">✦ ❄️ ✦</div></div></main><script>(function(){var root=document.querySelector('.xmas-page');if(!root)return;var field=root.querySelector('#christmas-search'),status=root.querySelector('#christmas-status'),btn=root.querySelector('#christmas-memo'),list=root.querySelector('#christmas-song-list');if(!field||!btn||!list)return;function norm(v){return v.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}function filter(){var songs=Array.from(list.querySelectorAll('.song'));var q=norm(field.value.trim()),count=0;songs.forEach(function(a){a.hidden=!norm(a.textContent).includes(q);if(!a.hidden)count++});status.textContent=count+' chanson'+(count!==1?'s':'')+(q?' trouvée'+(count!==1?'s':''):'')}field.addEventListener('input',filter);filter();var active=false;function render(){root.querySelectorAll('.lyrics').forEach(function(el){el.classList.toggle('memo',active);el.querySelectorAll(':scope > p').forEach(function(p){if(!p.dataset.fullHtml)p.dataset.fullHtml=p.innerHTML;if(!p.dataset.memoHtml){var first=p.dataset.fullHtml.split(/<br\s*\/?\s*>/i)[0];p.dataset.memoHtml=first+(p.querySelector('strong')&&!first.includes('</strong>')?'</strong>':'')}p.classList.toggle('memo-line',active);p.innerHTML=active?p.dataset.memoHtml:p.dataset.fullHtml})});btn.textContent=active?'☷ Paroles complètes':'☷ Pense-bête';btn.setAttribute('aria-pressed',String(active))}btn.addEventListener('click',function(){active=!active;render()})})();</script></body></html>
